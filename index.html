<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kids Sea Battle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sea: { 100:'#E0F7FA', 300:'#4DD0E1', 500:'#00BCD4', 700:'#0097A7' },
                        ship: { DEFAULT: '#FFB74D', active: '#FF9800' }, 
                        hit: '#EF5350', miss: '#FFFFFF'
                    },
                    fontFamily: { 'cute': ['"Fredoka"', 'sans-serif'] },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #E0F7FA;
            font-family: 'Fredoka', sans-serif;
            touch-action: manipulation;
            overflow: hidden;
            user-select: none;
        }

        /* --- Landscape Lock --- */
        #orientation-lock {
            display: none;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #00BCD4; z-index: 9999;
            flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center;
        }
        @media screen and (orientation: portrait) {
            #orientation-lock { display: flex; }
            main { display: none; }
        }

        /* --- Grid System --- */
        .board-container {
            display: grid;
            grid-template-columns: 20px repeat(10, 1fr); 
            grid-template-rows: 20px repeat(10, 1fr);
            gap: 2px;
        }
        .label-cell {
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; color: #0097A7; font-weight: bold;
        }
        .grid-cell {
            aspect-ratio: 1;
            background-color: #4DD0E1;
            border: 2px solid #80DEEA;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
        }
        
        /* Ship Styling */
        .grid-cell.occupied {
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }
        .grid-cell.occupied.preview { opacity: 0.5; }
        
        /* Hit/Miss Effects */
        .grid-cell.hit { background-color: #EF5350 !important; animation: shake 0.5s; }
        .grid-cell.hit::after { content: '💥'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.2rem; z-index: 10; }
        .grid-cell.miss { background-color: #B2EBF2 !important; }
        .grid-cell.miss::after { content: '💦'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1rem; opacity: 0.8; z-index: 10; }

        @keyframes shake {
            0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -2px); } 100% { transform: translate(0, 0); }
        }

        /* Turn Indicator Overlay */
        .disabled-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.2); z-index: 20;
            display: flex; align-items: center; justify-content: center;
            border-radius: 1rem; cursor: not-allowed;
            backdrop-filter: grayscale(0.5);
        }

        /* Sidebar Ship Item */
        .ship-item { transition: all 0.2s; border: 3px solid transparent; }
        .ship-item.selected { background-color: #FFF9C4; border-color: #FF9800; transform: scale(1.05); }
        .ship-item.placed { opacity: 0.3; pointer-events: none; filter: grayscale(100%); }

        /* Connection Dot */
        .pulse-dot { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); animation: pulse-green 2s infinite; }
        @keyframes pulse-green { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); } }
    </style>
</head>
<body class="h-screen flex flex-col text-slate-700">

    <div id="orientation-lock">
        <i class="fa-solid fa-mobile-screen-button fa-rotate-270 text-6xl mb-4 animate-bounce"></i>
        <h1 class="text-3xl font-bold">Please Rotate!</h1>
    </div>

    <!-- Header -->
    <header class="bg-sea-500 text-white p-2 px-4 flex justify-between items-center shadow-md z-10 h-16 shrink-0">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-ship text-2xl text-yellow-300"></i>
            <h1 class="text-2xl font-bold tracking-wide text-white drop-shadow-md">Sea Battle</h1>
        </div>
        
        <div class="flex items-center gap-2 bg-white/20 px-3 py-1 rounded-full">
            <div id="connDot" class="w-3 h-3 rounded-full bg-red-500 transition-colors duration-500"></div>
            <span id="connText" class="text-sm font-bold">Offline</span>
        </div>

        <div class="text-sm font-mono bg-sea-700 px-3 py-1 rounded-lg">
            Room: <span id="roomIdDisplay" class="text-yellow-300 font-bold">---</span>
        </div>
    </header>

    <!-- Main Game Area -->
    <main class="flex-1 relative w-full h-full overflow-hidden bg-sea-100 p-2">
        
        <!-- 1. Lobby -->
        <div id="lobbyScreen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-sea-300/90 backdrop-blur-sm">
            <div class="bg-white p-8 rounded-3xl shadow-xl max-w-sm w-full text-center border-4 border-sea-500">
                <div class="text-6xl mb-2">⚓️</div>
                <h2 class="text-4xl font-bold text-sea-700 mb-6">Let's Play!</h2>
                <input id="playerNameInput" type="text" placeholder="Your Name" class="w-full bg-slate-100 text-sea-700 text-xl font-bold border-2 border-sea-300 rounded-xl p-3 mb-4 focus:outline-none focus:border-sea-500 text-center placeholder-sea-300">
                <div class="flex flex-col gap-3">
                    <button onclick="createRoom()" class="bg-green-500 hover:bg-green-600 text-white text-xl font-bold py-3 px-6 rounded-2xl shadow-lg border-b-4 border-green-700 active:border-b-0 active:translate-y-1">
                        Create Room
                    </button>
                    <div class="flex gap-2">
                        <input id="joinRoomId" type="text" placeholder="1234" class="w-24 bg-slate-100 text-center font-bold border-2 border-sea-300 rounded-xl">
                        <button onclick="joinRoom()" class="flex-1 bg-yellow-400 hover:bg-yellow-500 text-white text-xl font-bold py-3 px-6 rounded-2xl shadow-lg border-b-4 border-yellow-600 active:border-b-0 active:translate-y-1">
                            Join Room
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. Setup Screen -->
        <div id="setupScreen" class="hidden h-full flex gap-4 max-w-6xl mx-auto items-center justify-center">
            <!-- Ship Inventory -->
            <div class="w-1/3 h-full max-h-[500px] flex flex-col gap-2 bg-white p-3 rounded-3xl shadow-lg border-4 border-sea-200">
                <h3 class="text-xl font-bold text-sea-700 text-center">My Fleet</h3>
                <div class="text-xs text-center text-slate-500 mb-1">Select ship, then tap board.<br>Tap ship on board to rotate!</div>
                
                <div id="shipList" class="flex-1 space-y-2 overflow-y-auto pr-1 flex flex-col items-center">
                    <!-- JS generated ships -->
                </div>

                <div class="flex gap-2">
                    <button onclick="randomizeShips()" class="flex-1 py-3 bg-blue-500 text-white font-bold rounded-xl shadow border-b-4 border-blue-700 active:border-b-0 active:translate-y-1">
                        Random 🔀
                    </button>
                    <button onclick="resetSetup()" class="px-4 py-3 bg-red-400 text-white font-bold rounded-xl shadow border-b-4 border-red-600 active:border-b-0 active:translate-y-1">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
                
                <button id="startGameBtn" onclick="setReady()" disabled class="w-full py-3 bg-gray-400 text-white text-xl font-bold rounded-xl shadow-lg border-b-4 border-gray-600 transition-all">
                    Place all ships!
                </button>
            </div>
            
            <!-- Setup Grid -->
            <div class="h-full aspect-square max-h-[90vh] bg-white p-3 rounded-3xl shadow-lg border-4 border-sea-200 flex flex-col items-center justify-center">
                 <div id="setupBoard" class="board-container w-full h-full bg-sea-100 p-1 rounded-xl">
                    <!-- JS fills grid -->
                 </div>
            </div>
            
            <!-- Waiting Modal -->
            <div id="waitingForOpponent" class="hidden absolute inset-0 bg-black/60 z-50 flex items-center justify-center backdrop-blur-sm">
                <div class="bg-white p-6 rounded-2xl text-center shadow-2xl animate-bounce">
                    <h3 class="text-2xl font-bold text-sea-700">Waiting for Opponent...</h3>
                    <p class="text-slate-500">They are placing their ships.</p>
                </div>
            </div>
        </div>

        <!-- 3. Battle Screen -->
        <div id="battleScreen" class="hidden h-full flex gap-4 max-w-7xl mx-auto items-center justify-center p-2 relative">
            
            <!-- Turn Banner -->
            <div id="turnBanner" class="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-2 z-40 bg-orange-500 text-white px-8 py-2 rounded-b-xl shadow-lg font-bold text-xl transition-all duration-300">
                Initializing...
            </div>

            <!-- Big Attack Map -->
            <div class="h-full aspect-square max-h-[85vh] flex flex-col">
                <div class="flex justify-between items-end mb-2 px-2">
                    <h3 class="text-2xl font-bold text-red-500 drop-shadow-sm">Attack Map</h3>
                    <button onclick="endGame()" class="bg-red-500 text-white text-xs px-3 py-1 rounded-full font-bold hover:bg-red-600">Quit</button>
                </div>
                <div class="flex-1 bg-white p-2 rounded-3xl shadow-xl border-4 border-red-200 relative">
                     <div id="enemyBoard" class="board-container w-full h-full bg-sea-100 p-1 rounded-xl"></div>
                     <!-- Disabled Overlay for Turn logic -->
                     <div id="enemyBoardOverlay" class="disabled-overlay hidden">
                         <span class="text-white font-bold text-2xl drop-shadow-md">Opponent's Turn</span>
                     </div>
                </div>
            </div>

            <!-- Small Status Map -->
            <div class="w-1/3 h-full max-h-[85vh] flex flex-col">
                <h3 class="text-xl font-bold text-sea-700 text-center mb-2">My Ships</h3>
                <div class="bg-white p-2 rounded-3xl shadow-lg border-4 border-sea-200 aspect-square mb-2">
                    <div id="playerBoard" class="board-container small-board w-full h-full bg-sea-100 p-1 rounded-lg"></div>
                </div>
                <!-- Status Box -->
                <div class="flex-1 bg-white rounded-3xl shadow p-2 flex flex-col justify-center items-center gap-1 border-4 border-sea-100">
                     <div class="text-slate-400 text-xs font-bold uppercase">vs</div>
                     <div id="opponentNameDisplay" class="text-lg text-sea-700 font-bold">Opponent</div>
                </div>
            </div>
        </div>

    </main>
    
    <footer id="gameLog" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-white/90 backdrop-blur px-6 py-2 rounded-full shadow-lg text-lg font-bold text-sea-700 pointer-events-none transition-all duration-300 z-50 border-2 border-sea-200 whitespace-nowrap">
        Connecting...
    </footer>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
        import { getFirestore, collection, addDoc, doc, onSnapshot, updateDoc, setDoc, getDoc, deleteDoc, arrayUnion } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

        // --- 1. CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyAFHSgSTrxn5D0tQOsbUckQ_xEvxbh2mq4",
            authDomain: "battleship-d5dbb.firebaseapp.com",
            projectId: "battleship-d5dbb",
            storageBucket: "battleship-d5dbb.firebasestorage.app",
            messagingSenderId: "40264054224",
            appId: "1:40264054224:web:e8176d4669aeca6b7535d5"
        };

        // --- 2. INIT ---
        let app, auth, db, user;
        const appId = "kids-battle-ship-v1"; 

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            
            signInAnonymously(auth).catch(e => console.error(e));
            onAuthStateChanged(auth, (u) => {
                const dot = document.getElementById('connDot');
                const text = document.getElementById('connText');
                if (u) {
                    user = u;
                    dot.classList.remove('bg-red-500'); dot.classList.add('bg-green-500', 'pulse-dot');
                    text.innerText = "Connected";
                    updateLog("✅ Ready to play!");
                } else {
                    dot.classList.remove('bg-green-500', 'pulse-dot'); dot.classList.add('bg-red-500');
                    text.innerText = "Offline";
                }
            });
        } catch (e) { console.error(e); }

        // --- 3. CONSTANTS ---
        const FLEET_TYPES = [
            { id: 'carrier', name: 'Carrier', size: 5, color: 'bg-yellow-500' },
            { id: 'battleship', name: 'Battleship', size: 4, color: 'bg-orange-500' },
            { id: 'cruiser', name: 'Cruiser', size: 3, color: 'bg-red-400' },
            { id: 'submarine', name: 'Sub', size: 3, color: 'bg-green-500' },
            { id: 'destroyer', name: 'Destroyer', size: 2, color: 'bg-blue-400' }
        ];

        // --- 4. GAME STATE ---
        let currentRoomId = null;
        let isHost = false;
        let placedShips = []; // { id, size, index, horizontal, color }
        let selectedShipType = null; 
        
        // Battle State
        let enemyShipsCache = []; // Stores opponent's ships for hit detection
        let myShots = []; // Indices I attacked
        let enemyShots = []; // Indices enemy attacked

        // --- 5. SETUP LOGIC ---
        
        window.renderShipList = function() {
            const list = document.getElementById('shipList');
            list.innerHTML = '';
            
            FLEET_TYPES.forEach(ship => {
                const isPlaced = placedShips.find(s => s.id === ship.id);
                const div = document.createElement('div');
                div.className = `ship-item w-full p-2 rounded-xl bg-sea-100 border border-sea-300 cursor-pointer flex justify-between items-center ${isPlaced ? 'placed' : ''} ${selectedShipType?.id === ship.id ? 'selected' : ''}`;
                if (!isPlaced) div.onclick = () => selectShipType(ship);
                let blocks = '';
                for(let i=0; i<ship.size; i++) blocks += `<div class="w-4 h-4 rounded ${ship.color} border border-white"></div>`;
                div.innerHTML = `<span class="font-bold text-sm">${ship.name} (${ship.size})</span><div class="flex gap-1">${blocks}</div>`;
                list.appendChild(div);
            });
            checkStartButton();
        }

        window.selectShipType = function(ship) {
            selectedShipType = ship;
            renderShipList(); 
            updateLog(`Selected ${ship.name}. Tap board to place.`);
        }

        window.handleSetupClick = function(index) {
            const clickedShipIndex = placedShips.findIndex(s => getShipIndices(s.index, s.size, s.horizontal).includes(index));

            if (clickedShipIndex !== -1) {
                // Rotate Logic
                const ship = placedShips[clickedShipIndex];
                const newHorizontal = !ship.horizontal;
                placedShips.splice(clickedShipIndex, 1);
                
                if (isValidPlacement(ship.index, ship.size, newHorizontal)) {
                    ship.horizontal = newHorizontal;
                    placedShips.push(ship);
                    updateLog(`Rotated ${ship.name}!`);
                } else {
                    ship.horizontal = !newHorizontal; // Fail, put back
                    placedShips.push(ship);
                    updateLog(`Can't rotate here.`);
                    shakeBoard();
                }
                renderShipList();
                createGrid('setupBoard', true); 
                return;
            }

            // Place New Ship
            if (selectedShipType) {
                if (isValidPlacement(index, selectedShipType.size, true)) {
                    placedShips.push({
                        id: selectedShipType.id, name: selectedShipType.name, size: selectedShipType.size, color: selectedShipType.color,
                        index: index, horizontal: true 
                    });
                    selectedShipType = null;
                    renderShipList();
                    createGrid('setupBoard', true);
                } else {
                    updateLog("Can't place here!");
                    shakeBoard();
                }
            }
        }

        function getShipIndices(startIndex, size, horizontal) {
            let indices = [];
            let r = Math.floor(startIndex / 10);
            let c = startIndex % 10;
            for (let i = 0; i < size; i++) {
                if (horizontal) indices.push(r * 10 + (c + i));
                else indices.push((r + i) * 10 + c);
            }
            return indices;
        }

        function isValidPlacement(index, size, horizontal) {
            let r = Math.floor(index / 10);
            let c = index % 10;
            if (horizontal && c + size > 10) return false;
            if (!horizontal && r + size > 10) return false;
            const newIndices = getShipIndices(index, size, horizontal);
            for (let s of placedShips) {
                const existingIndices = getShipIndices(s.index, s.size, s.horizontal);
                if (newIndices.some(idx => existingIndices.includes(idx))) return false;
            }
            return true;
        }

        window.randomizeShips = function() {
            placedShips = [];
            for (let ship of FLEET_TYPES) {
                let placed = false;
                let attempts = 0;
                while (!placed && attempts < 100) {
                    const idx = Math.floor(Math.random() * 100);
                    const horiz = Math.random() > 0.5;
                    if (isValidPlacement(idx, ship.size, horiz)) {
                        placedShips.push({
                            id: ship.id, name: ship.name, size: ship.size, color: ship.color,
                            index: idx, horizontal: horiz
                        });
                        placed = true;
                    }
                    attempts++;
                }
            }
            renderShipList();
            createGrid('setupBoard', true);
        }

        window.resetSetup = function() {
            placedShips = []; selectedShipType = null;
            renderShipList(); createGrid('setupBoard', true);
        }

        function checkStartButton() {
            const btn = document.getElementById('startGameBtn');
            if (placedShips.length === FLEET_TYPES.length) {
                btn.disabled = false;
                btn.classList.remove('bg-gray-400');
                btn.classList.add('bg-green-500', 'animate-pulse');
                btn.innerText = "I'm Ready! ▶";
            } else {
                btn.disabled = true;
                btn.classList.add('bg-gray-400');
                btn.classList.remove('bg-green-500', 'animate-pulse');
                btn.innerText = `Place all ships (${placedShips.length}/5)`;
            }
        }

        // --- 6. ROOM & SYNC LOGIC ---

        window.createRoom = async function() {
            if (!user) return alert("Wait for connection...");
            const name = document.getElementById('playerNameInput').value || "Captain";
            const roomId = Math.floor(1000 + Math.random() * 9000).toString();
            currentRoomId = roomId; isHost = true;

            try {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                await setDoc(roomRef, {
                    host: { uid: user.uid, name: name, ready: false },
                    status: 'waiting', 
                    moves: [], // { uid: string, index: number }
                    currentTurn: null,
                    createdAt: Date.now()
                });
                document.getElementById('roomIdDisplay').innerText = roomId;
                switchScreen('setupScreen');
                listenToRoom(roomId);
            } catch (err) { console.error(err); alert("Create Error. Check Rules."); }
        };

        window.joinRoom = async function() {
            if (!user) return;
            const name = document.getElementById('playerNameInput').value || "Sailor";
            const roomId = document.getElementById('joinRoomId').value;
            if (!roomId || roomId.length !== 4) return alert("Enter 4-digit ID");

            try {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                const roomSnap = await getDoc(roomRef);
                if (roomSnap.exists()) {
                    await updateDoc(roomRef, { 
                        "guest.uid": user.uid, 
                        "guest.name": name,
                        "guest.ready": false,
                        status: 'setup', 
                        lastAction: 'Joined' 
                    });
                    currentRoomId = roomId; isHost = false;
                    document.getElementById('roomIdDisplay').innerText = roomId;
                    switchScreen('setupScreen');
                    listenToRoom(roomId);
                } else { alert("Room not found!"); }
            } catch (err) { console.error(err); }
        };

        // Player clicks Ready -> Uploads Ships
        window.setReady = async function() {
            if (!currentRoomId) return;
            document.getElementById('startGameBtn').disabled = true;
            document.getElementById('startGameBtn').innerText = "Waiting for Opponent...";
            document.getElementById('waitingForOpponent').classList.remove('hidden');

            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId);
            
            // Upload ships to my slot
            const updatePayload = {};
            const role = isHost ? 'host' : 'guest';
            updatePayload[`${role}.ships`] = placedShips;
            updatePayload[`${role}.ready`] = true;
            updatePayload['lastAction'] = `${role.toUpperCase()} is Ready`;

            await updateDoc(roomRef, updatePayload);
        }

        function listenToRoom(roomId) {
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
            onSnapshot(roomRef, (docSnap) => {
                if (!docSnap.exists()) { alert("Room closed."); location.reload(); return; }
                const data = docSnap.data();
                
                // 1. Check for Game Start
                if (data.host?.ready && data.guest?.ready && data.status !== 'playing') {
                    // Triggers once when both ready
                    if (isHost) {
                        const startPlayer = Math.random() > 0.5 ? data.host.uid : data.guest.uid;
                        updateDoc(roomRef, {
                            status: 'playing',
                            currentTurn: startPlayer,
                            lastAction: "Game Started"
                        });
                    }
                }

                // 2. State Transition: Setup -> Battle
                if (data.status === 'playing') {
                    // CACHE ENEMY SHIPS for local hit detection
                    if (isHost) enemyShipsCache = data.guest.ships || [];
                    else enemyShipsCache = data.host.ships || [];
                    
                    // Display Opponent Name
                    const oppName = isHost ? (data.guest?.name || 'Guest') : (data.host?.name || 'Host');
                    document.getElementById('opponentNameDisplay').innerText = oppName;

                    // PROCESS MOVES
                    myShots = [];
                    enemyShots = [];
                    if (data.moves) {
                        data.moves.forEach(m => {
                            if (m.uid === user.uid) myShots.push(m.index);
                            else enemyShots.push(m.index);
                        });
                    }

                    // Update UI Turn
                    updateTurnUI(data.currentTurn);
                    
                    // Switch Screen if not already
                    if (!document.getElementById('setupScreen').classList.contains('hidden')) {
                         switchScreen('battleScreen');
                    } else {
                        // Refresh boards if already in battle
                        createGrid('enemyBoard', true);
                        createGrid('playerBoard', false);
                    }
                }
                
                if (data.lastAction) updateLog(`🔔 ${data.lastAction}`);
            });
        }
        
        function updateTurnUI(turnUid) {
            const isMyTurn = turnUid === user.uid;
            const banner = document.getElementById('turnBanner');
            const overlay = document.getElementById('enemyBoardOverlay');
            
            if (isMyTurn) {
                banner.innerText = "YOUR TURN!";
                banner.className = "absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-2 z-40 bg-green-500 text-white px-8 py-2 rounded-b-xl shadow-lg font-bold text-xl animate-bounce";
                overlay.classList.add('hidden');
            } else {
                banner.innerText = "Opponent's Turn";
                banner.className = "absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-2 z-40 bg-gray-500 text-white px-6 py-2 rounded-b-xl shadow-lg font-bold text-lg";
                overlay.classList.remove('hidden');
            }
        }

        // --- 7. BATTLE LOGIC (REAL SYNC) ---
        
        window.handleAttack = function(index) {
            // Check handled by UI Overlay, but double check here
            if (!currentRoomId) return;
            
            // Check if already shot here
            if (myShots.includes(index)) return;

            // Optimistic UI Update (will be overwritten by DB sync shortly)
            // But we actually wait for DB sync to be safe in this version
            
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId);
            
            // Toggle Turn
            // Note: We need to know who the other player is.
            // Simplified: Just set currentTurn to "not me" isn't enough, we need the UID.
            // We can fetch the doc to be sure, or rely on local state.
            // Let's assume we toggle based on cached data would be risky. 
            // Better: use a Cloud Function or just read from local cache of 'listenToRoom'.
            // For this simple client-side: we just stored host/guest UIDs.
            
            // We need to fetch current state to know opponent UID safely? 
            // We can assume we know who we are (Host or Guest).
            
            // Wait, we don't have opponent UID stored globally easily. Let's fix that.
            // Actually 'listenToRoom' has data.host.uid etc.
            // Let's rely on the fact that if I am host, next turn is Guest.
            
            // Let's find opponent UID from a dirty trick: snapshot data isn't global.
            // We will fetch doc strictly to ensure consistency.
            getDoc(roomRef).then(snap => {
                const data = snap.data();
                if (data.currentTurn !== user.uid) return; // Not my turn
                
                const nextTurn = (user.uid === data.host.uid) ? data.guest.uid : data.host.uid;
                
                // Add move
                const newMove = { uid: user.uid, index: index };
                
                updateDoc(roomRef, {
                    moves: arrayUnion(newMove),
                    currentTurn: nextTurn,
                    lastAction: `Shot fired!`
                });
            });
        }

        // --- 8. VISUALS ---
        const COLS = ['A','B','C','D','E','F','G','H','I','J'];

        function createGrid(elementId, interactive = false) {
            const board = document.getElementById(elementId);
            board.innerHTML = ''; 
            board.appendChild(createLabel('')); 
            for (let c of COLS) board.appendChild(createLabel(c));

            for (let r = 0; r < 10; r++) {
                board.appendChild(createLabel(r + 1));
                for (let c = 0; c < 10; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    const index = r * 10 + c;

                    // --- SETUP ---
                    if (elementId === 'setupBoard') {
                        const ship = placedShips.find(s => getShipIndices(s.index, s.size, s.horizontal).includes(index));
                        if (ship) { cell.classList.add('occupied', ship.color); }
                        if (interactive) cell.onclick = () => handleSetupClick(index);
                    }

                    // --- PLAYER BOARD (My View) ---
                    if (elementId === 'playerBoard') {
                        // 1. Draw My Ships
                        const ship = placedShips.find(s => getShipIndices(s.index, s.size, s.horizontal).includes(index));
                        if (ship) { cell.classList.add('occupied', ship.color); }
                        
                        // 2. Draw Enemy Shots
                        if (enemyShots.includes(index)) {
                            // Check Hit
                            if (ship) cell.classList.add('hit');
                            else cell.classList.add('miss');
                        }
                    }
                    
                    // --- ENEMY BOARD (Attack View) ---
                    if (elementId === 'enemyBoard') {
                        // 1. Draw My Shots
                        if (myShots.includes(index)) {
                            // Check Hit against CACHED enemy ships
                            const hitShip = enemyShipsCache.find(s => getShipIndices(s.index, s.size, s.horizontal).includes(index));
                            if (hitShip) cell.classList.add('hit');
                            else cell.classList.add('miss');
                        } else if (interactive) {
                            // Only allow click if not shot yet
                            cell.onclick = () => handleAttack(index);
                        }
                    }
                    board.appendChild(cell);
                }
            }
        }

        function createLabel(text) {
            const el = document.createElement('div');
            el.className = 'label-cell';
            el.innerText = text;
            return el;
        }

        window.switchScreen = function(screenId) {
            document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
            
            if (screenId === 'setupScreen') {
                renderShipList();
                createGrid('setupBoard', true);
            } else if (screenId === 'battleScreen') {
                // Initial render, will be updated by snapshot
                createGrid('enemyBoard', true);
                createGrid('playerBoard', false);
            }
        }
        
        window.endGame = async function() {
            if (confirm("Quit game?")) {
                if(currentRoomId) deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId));
                location.reload();
            }
        }

        window.updateLog = function(msg) {
            const logEl = document.getElementById('gameLog');
            logEl.style.opacity = 0;
            setTimeout(() => { logEl.innerText = msg; logEl.style.opacity = 1; }, 100);
        }
        
        function playSound(type) { console.log(type); }
        function shakeBoard() {
             const board = document.getElementById('setupBoard');
             board.style.transform = "translateX(5px)";
             setTimeout(()=>board.style.transform = "translateX(-5px)", 50);
             setTimeout(()=>board.style.transform = "translateX(0)", 100);
        }
    </script>
</body>
</html>
