<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kids Sea Battle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sea: { 100:'#E0F7FA', 300:'#4DD0E1', 500:'#00BCD4', 700:'#0097A7' },
                        ship: { DEFAULT: '#FFB74D', active: '#FF9800' }, 
                        hit: '#EF5350', miss: '#FFFFFF'
                    },
                    fontFamily: { 'cute': ['"Fredoka"', 'sans-serif'] },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'bounce-slight': 'bounce 0.5s infinite',
                        'pop-in': 'popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                        'slide-down': 'slideDown 0.3s ease-out',
                        'slide-up': 'slideUp 0.2s ease-out',
                    },
                    keyframes: {
                        popIn: { '0%': { transform: 'scale(0)' }, '100%': { transform: 'scale(1)' } },
                        slideDown: { '0%': { transform: 'translateY(-100%)', opacity: 0 }, '100%': { transform: 'translateY(0)', opacity: 1 } },
                        slideUp: { '0%': { transform: 'translateY(10px)', opacity: 0 }, '100%': { transform: 'translateY(0)', opacity: 1 } }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #E0F7FA;
            font-family: 'Fredoka', sans-serif;
            touch-action: manipulation;
            overflow: hidden;
            user-select: none;
            /* Prevent tap highlight color on mobile */
            -webkit-tap-highlight-color: transparent;
        }

        /* --- GRID STYLES --- */
        .board-container {
            display: grid;
            grid-template-columns: 1.2rem repeat(10, 1fr); 
            grid-template-rows: 1.2rem repeat(10, 1fr);
            gap: 1px;
            width: 100%;
            height: 100%;
        }
        .label-cell {
            display: flex; align-items: center; justify-content: center;
            font-size: 0.6rem; color: #0097A7; font-weight: bold;
        }
        .grid-cell {
            aspect-ratio: 1;
            background-color: #4DD0E1;
            border: 1px solid #80DEEA;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            overflow: visible; 
        }
        /* Visual Feedback for Pressing */
        .grid-cell:active {
            transform: scale(0.9);
            background-color: #00BCD4; /* Darker blue when pressed */
            border-color: #0097A7;
        }
        .grid-cell.occupied { border-color: rgba(255, 255, 255, 0.5); box-shadow: inset 0 0 5px rgba(0,0,0,0.2); }
        .grid-cell.hit { background-color: #EF5350 !important; animation: shake 0.5s; }
        .grid-cell.hit::after { content: '💥'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 0.8rem; z-index: 10; }
        .grid-cell.miss { background-color: #B2EBF2 !important; }
        .grid-cell.miss::after { content: '💦'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 0.6rem; opacity: 0.8; z-index: 10; }
        
        /* FIX 5: Disable clicks visually */
        .grid-disabled { pointer-events: none; opacity: 0.8; cursor: not-allowed; }

        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -2px); } 100% { transform: translate(0, 0); } }

        /* --- RESPONSIVE BOARD LOGIC (FAIL-SAFE) --- */
        /* Mobile Portrait: Width-driven */
        .mobile-board-sizer {
            width: 95vw;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
        }
        /* Desktop Landscape: Height-driven */
        .desktop-board-sizer {
            height: 75vh;
            max-height: 95%;
            aspect-ratio: 1 / 1;
            margin: auto;
        }

        /* --- VFX ANIMATIONS --- */
        .missile { position: absolute; font-size: 3rem; pointer-events: none; filter: drop-shadow(0 0 8px orange); left: 0; top: 0; z-index: 201; }
        .atomic-core { position: absolute; left: 0; top: 0; width: 20px; height: 20px; background: radial-gradient(circle, #ffffff 0%, #ffeb3b 30%, #ff9800 60%, #ff5722 100%); border-radius: 50%; z-index: 202; pointer-events: none; box-shadow: 0 0 60px 30px rgba(255, 152, 0, 0.8); animation: atomic-expand 1.5s ease-out forwards; }
        .atomic-wave { position: absolute; left: 0; top: 0; width: 10px; height: 10px; border: 4px solid rgba(255, 255, 255, 0.9); border-radius: 50%; z-index: 201; pointer-events: none; animation: shockwave 1s ease-out forwards; }
        @keyframes atomic-expand { 0% { transform: translate(-50%, -50%) scale(0); opacity: 1; } 10% { transform: translate(-50%, -50%) scale(8); opacity: 1; } 50% { transform: translate(-50%, -50%) scale(10); opacity: 0.8; } 100% { transform: translate(-50%, -50%) scale(12); opacity: 0; } }
        @keyframes shockwave { 0% { transform: translate(-50%, -50%) scale(0); opacity: 1; border-width: 10px; } 100% { transform: translate(-50%, -50%) scale(20); opacity: 0; border-width: 0px; } }
        
        .confetti { position: absolute; width: 12px; height: 12px; bottom: 100%; animation: fall-spin linear infinite; }
        @keyframes fall-spin { to { transform: translateY(100vh) rotate(720deg); } }
        .rain { position: absolute; width: 3px; height: 15px; background: #60A5FA; bottom: 100%; animation: fall linear infinite; }
        @keyframes fall { to { transform: translateY(100vh); } }

        .disabled-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.2); z-index: 20; display: flex; align-items: center; justify-content: center; border-radius: 1rem; cursor: not-allowed; backdrop-filter: grayscale(0.5); }
        .ship-item { transition: all 0.2s; border: 3px solid transparent; }
        .ship-item.selected { background-color: #FFF9C4; border-color: #FF9800; transform: scale(1.05); }
        .ship-item.placed { opacity: 0.3; pointer-events: none; filter: grayscale(100%); }
        .emoji-btn { transition: all 0.1s; }
        .emoji-btn:active { transform: scale(0.8); background-color: #93C5FD; }
        .pulse-dot { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); animation: pulse-green 2s infinite; }
        @keyframes pulse-green { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); } }

        /* --- HUD STYLES --- */
        .hud-ship { display: flex; gap: 2px; align-items: center; opacity: 0.4; transition: all 0.5s; padding: 2px; border-radius: 4px; }
        .hud-ship.sunk { opacity: 1; }
        .hud-ship.sunk .hud-block { background-color: #EF5350; box-shadow: 0 0 5px #EF5350; }
        .hud-block { width: 8px; height: 8px; background-color: #64748B; border-radius: 2px; }
        @media (min-width: 768px) {
            .hud-block { width: 12px; height: 12px; }
            .hud-ship { gap: 3px; }
        }
    </style>
</head>

    <div id="versionLabel" class="fixed bottom-1 right-1 text-xs text-slate-400 pointer-events-none z-50"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
        import { getFirestore, collection, addDoc, doc, onSnapshot, updateDoc, setDoc, getDoc, deleteDoc, arrayUnion, getDocs, runTransaction } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

        // --- VERSION ---
        const APP_VERSION = "v1.36 (Child-Proof)";
        document.getElementById('versionLabel').innerText = APP_VERSION;

        // GLOBAL CONSTANT
        const COLS = ['A','B','C','D','E','F','G','H','I','J'];

        // --- AUDIO (FIX 3: LAZY INIT) ---
        // FIX: Remove global AudioContext creation to prevent autoplay policy errors
        let audioCtx = null;
        
        // Function to initialize audio on first user interaction
        function initAudio() {
            if (audioCtx) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                // Resume immediately in case it's suspended
                if (audioCtx.state === 'suspended') audioCtx.resume();
                console.log("🔊 Audio Context Initialized");
            } catch (e) { console.error("Audio init error", e); }
        }

        const SoundFX = {
            ensureContext: () => {
                if (!audioCtx) initAudio();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            },
            playNoise: (duration, type = 'highpass') => {
                SoundFX.ensureContext();
                if (!audioCtx) return;
                const bufferSize = audioCtx.sampleRate * duration;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = type;
                filter.frequency.value = 1000;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start();
            },
            launch: () => {
                SoundFX.ensureContext();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.6);
            },
            boom: () => SoundFX.playNoise(0.3, 'lowpass'),
            splash: () => SoundFX.playNoise(0.3, 'highpass'),
            sink: () => {
                 SoundFX.ensureContext();
                 if (!audioCtx) return;
                 SoundFX.playNoise(2.0, 'lowpass');
                 const osc = audioCtx.createOscillator();
                 const gain = audioCtx.createGain();
                 osc.type = 'sawtooth';
                 osc.frequency.setValueAtTime(80, audioCtx.currentTime);
                 osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 1.5);
                 gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                 gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
                 osc.connect(gain); gain.connect(audioCtx.destination);
                 osc.start(); osc.stop(audioCtx.currentTime + 1.5);
            },
            victory: () => { 
                SoundFX.ensureContext();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                [261.63, 329.63, 392.00, 523.25].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.1, now + i * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.4);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.15); osc.stop(now + i * 0.15 + 0.4);
                });
            },

            ping: () => {
                SoundFX.ensureContext();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            },

            bell: () => {
                SoundFX.ensureContext();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                // Create two distinct strikes "Ding-Ding"
                [0, 0.4].forEach((delay) => {

                    [880, 1760, 2640].forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = i === 0 ? 'sine' : 'triangle'; // Mix sine/triangle
                        osc.frequency.value = freq;
                        
                        gain.gain.setValueAtTime(0.1 / (i+1), now + delay);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 1.2);
                        
                        osc.connect(gain); gain.connect(audioCtx.destination);
                        osc.start(now + delay); osc.stop(now + delay + 1.2);
                    });
                });
            }

        function getShipIndices(startIndex, size, horizontal) {
            let indices = [];
            let r = Math.floor(startIndex / 10);
            let c = startIndex % 10;
            for (let i = 0; i < size; i++) {
                if (horizontal) indices.push(r * 10 + (c + i));
                else indices.push((r + i) * 10 + c);
            }
            return indices;
        }

        function isValidPlacement(index, size, horizontal) {
            let r = Math.floor(index / 10);
            let c = index % 10;
            if (horizontal && c + size > 10) return false;
            if (!horizontal && r + size > 10) return false;
            const newIndices = getShipIndices(index, size, horizontal);
            for (let s of placedShips) {
                const existingIndices = getShipIndices(s.index, s.size, s.horizontal);
                if (newIndices.some(idx => existingIndices.includes(idx))) return false;
            }
            return true;
        }

        // FIX 4: ROBUST RANDOM PLACEMENT (Prevent Infinite Loop)
        window.randomizeShips = function() {
            let success = false;
            let attempts = 0;
            const MAX_TOTAL_ATTEMPTS = 20;

            while (!success && attempts < MAX_TOTAL_ATTEMPTS) {
                attempts++;
                let tempPlaced = [];
                let thisAttemptSuccess = true;

                for (let ship of FLEET_TYPES) {
                    let placed = false;
                    let shipAttempts = 0;
                    // Try to place this single ship up to 50 times
                    while (!placed && shipAttempts < 50) {
                        const idx = Math.floor(Math.random() * 100);
                        const horiz = Math.random() > 0.5;
                        
                        // Check validity against tempPlaced
                        let valid = true;
                        let r = Math.floor(idx / 10);
                        let c = idx % 10;
                        if (horiz && c + ship.size > 10) valid = false;
                        if (!horiz && r + ship.size > 10) valid = false;
                        
                        if (valid) {
                             const newIndices = [];
                             for(let i=0; i<ship.size; i++) newIndices.push(horiz ? idx+i : idx+(i*10));
                             
                             for (let s of tempPlaced) {
                                 const existingIndices = [];
                                 let sr = Math.floor(s.index / 10);
                                 let sc = s.index % 10;
                                 for(let i=0; i<s.size; i++) existingIndices.push(s.horizontal ? s.index+i : s.index+(i*10));
                                 
                                 if (newIndices.some(n => existingIndices.includes(n))) {
                                     valid = false; break;
                                 }
                             }
                        }

                        if (valid) {
                            tempPlaced.push({ id: ship.id, name: ship.name, size: ship.size, color: ship.color, index: idx, horizontal: horiz });
                            placed = true;
                        }
                        shipAttempts++;
                    }

                    if (!placed) {
                        thisAttemptSuccess = false;
                        break; // Break ship loop, start over total attempt
                    }
                }

                if (thisAttemptSuccess && tempPlaced.length === FLEET_TYPES.length) {
                    placedShips = tempPlaced;
                    success = true;
                }
            }

            if (success) {
                renderShipList(); updateGrids();
            } else {
                updateLog("⚠️ Random placement failed. Try again.");
            }
        }

        function listenToRoom(roomId) {
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
            onSnapshot(roomRef, (docSnap) => {
                if (!docSnap.exists()) { alert("Room deleted."); location.reload(); return; }
                const data = docSnap.data();

                // FIX 6: FAIR DEADLOCK AUTO-FIXER (State Reconstruction)
                // If game is playing but turn is invalid/missing, Host takes control to fix it fairly
                if (isHost && data.status === 'playing') {
                     const validTurn = (data.currentTurn === data.host.uid || data.currentTurn === data.guest.uid);
                     if (!validTurn) {
                         console.log("🚑 Game stuck! Reconstructing turn history...");
                         let nextPlayer = data.host.uid; // Default fallback

                         // Use history to determine whose turn it really is
                         if (data.moves && data.moves.length > 0) {
                             const lastMove = data.moves[data.moves.length - 1];
                             // If Host moved last, it MUST be Guest's turn
                             if (lastMove.uid === data.host.uid) {
                                 nextPlayer = data.guest.uid;
                             } else {
                                 // If Guest moved last, it MUST be Host's turn
                                 nextPlayer = data.host.uid;
                             }
                         }
                         
                         // Apply the fair fix
                         updateDoc(roomRef, { currentTurn: nextPlayer, lastAction: "Game Recovered" });
                     }
                }
                
                // If it's my turn, unlock the board
                if (data.status === 'playing') {
                     const enemyBoards = [document.getElementById('enemyBoard'), document.getElementById('enemyBoardDesktop')];
                     if (data.currentTurn === user.uid) {
                         isProcessingTurn = false; // Reset lock for new turn
                         enemyBoards.forEach(b => b?.classList.remove('grid-disabled'));
                     } else {
                         enemyBoards.forEach(b => b?.classList.add('grid-disabled'));
                     }
                } else {
                     // Setup phase: Ensure setup boards are NOT disabled
                     document.querySelectorAll('.board-container').forEach(el => el.classList.remove('grid-disabled'));
                }

                if (data.host?.ready && data.guest?.ready && data.status !== 'playing' && data.status !== 'finished') {
                    if (isHost) {
                        const startPlayer = Math.random() > 0.5 ? data.host.uid : data.guest.uid;
                        updateDoc(roomRef, { status: 'playing', currentTurn: startPlayer, lastAction: "Game Started" });
                    }
                }

                if (data.status === 'finished') {
                    showGameOver(data.winner);
                }

                if (data.status === 'playing' || data.status === 'finished') {
                    if (isHost) enemyShipsCache = data.guest.ships || [];
                    else enemyShipsCache = data.host.ships || [];
                    
                    const oppName = isHost ? (data.guest?.name || 'Guest') : (data.host?.name || 'Host');
                    document.getElementById('opponentNameDisplay').innerText = oppName;

                    const newMyShots = [];
                    const newEnemyShots = [];
                    if (data.moves) {
                        data.moves.forEach(m => {
                            if (m.uid === user.uid) newMyShots.push(m.index);
                            else newEnemyShots.push(m.index);
                        });
                    }
                    
                    myShots = newMyShots;
                    enemyShots = newEnemyShots;
                    
                    checkAllSinks(myShots, enemyShipsCache, 'enemyBoard'); 
                    checkAllSinks(myShots, enemyShipsCache, 'enemyBoardDesktop');
                    checkAllSinks(enemyShots, placedShips, 'playerBoard'); 
                    
                    if (data.status === 'playing') {
                        if (checkWin(myShots, enemyShipsCache)) {
                            updateDoc(roomRef, { status: 'finished', winner: user.uid });
                        } else if (checkWin(enemyShots, placedShips)) {
                            const winnerUid = isHost ? data.guest.uid : data.host.uid;
                            updateDoc(roomRef, { status: 'finished', winner: winnerUid });
                        }
                    }

                    updateTurnUI(data.currentTurn, data.status);
                    
                    if (document.getElementById('battleScreen').classList.contains('hidden')) {
                        switchScreen('battleScreen');
                    } else {
                        updateGrids();
                    }
                }
                
                if (data.chatHistory) {
                    const chatEl = document.getElementById('chatHistory');
                    const newCount = data.chatHistory.length;
                    
                    // NEW: Sound notification logic
                    if (newCount > previousChatLength) {
                        // Get the latest message
                        const lastMsg = data.chatHistory[newCount - 1];
                        // If it's from the opponent AND we are not in initial load (initial load previousChatLength is 0)
                        if (previousChatLength > 0 && lastMsg.senderUid !== user.uid) {
                            SoundFX.ping(); // Play notification sound
                        }
                    }

                    // Render Chat
                    if (newCount > (chatEl.childElementCount - 1 < 0 ? 0 : chatEl.childElementCount - 1)) {
                        chatEl.innerHTML = ''; 
                        data.chatHistory.forEach(msg => {
                            const isMe = msg.senderUid === user.uid;
                            const bubble = document.createElement('div');

                            bubble.innerText = msg.emoji;
                            chatEl.appendChild(bubble);

                        chatEl.scrollTop = chatEl.scrollHeight;

        function checkWin(shots, ships) {
            if (!ships || ships.length === 0) return false;
            return ships.every(ship => {
                const indices = getShipIndices(ship.index, ship.size, ship.horizontal);

            });
        }

        function checkAllSinks(shots, ships, boardId) {
            ships.forEach(ship => {
                // FIX: Unique ID per fleet owner (enemy vs player)
                // If boardId starts with 'enemy', it's the opponent's fleet being checked.
                const isEnemyCheck = boardId.startsWith('enemy');
                const ownerPrefix = isEnemyCheck ? 'enemy' : 'player';
                const shipId = `${ownerPrefix}-${ship.id}-sunk`; 

                const indices = getShipIndices(ship.index, ship.size, ship.horizontal);
                const isSunk = indices.every(idx => shots.includes(idx));
                
                // NEW: Update HUD if this is the enemy board check
                if (isEnemyCheck) {
                    markHudShipAsSunk(ship.id, isSunk);
                }

                if (!sunkShipsLog.has(shipId) && isSunk) {
                    sunkShipsLog.add(shipId);
                    latestSinkTime = Date.now(); // Record time of new sink
                    SoundFX.sink();
                    const centerIdx = indices[Math.floor(indices.length/2)];
                    
                    // Trigger visual explosion on the correct board
                    if (isEnemyCheck) {
                        if (document.getElementById('enemyBoard').offsetParent) triggerAtomicExplosion('enemyBoard', centerIdx);
                        if (document.getElementById('enemyBoardDesktop').offsetParent) triggerAtomicExplosion('enemyBoardDesktop', centerIdx);
                        updateLog("BOOM! Enemy ship sunk!");
                    } else {
                        triggerAtomicExplosion('playerBoard', centerIdx);
                        updateLog("OUCH! Your ship sunk!");
                    }
                }
            });
        }

        function updateTurnUI(turnUid, status) {

            if (turnUid && turnUid === user.uid && lastTurnUid !== turnUid && status === 'playing') {
                 triggerTurnNotification();

            // Update last state
            if (status === 'playing') lastTurnUid = turnUid;

            if (status === 'finished') {
                banner.innerText = "GAME OVER";
                banner.className = "absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-2 z-40 bg-purple-600 text-white px-8 py-2 rounded-b-xl shadow-lg font-bold text-xl";
                banner.style.opacity = 1;
                overlays.forEach(o => o?.classList.add('hidden')); 
                return;

            if (!turnUid) return;
            const isMyTurn = turnUid === user.uid;
            
            // ADJUSTED: Changed translation values to pull banner UP (-translate-y-4)
            // ADJUSTED: Reduced padding (py-1) and font size (text-sm) for mobile compactness
            if (isMyTurn) {
                banner.innerText = "YOUR TURN!";
                banner.className = "absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-4 z-40 bg-green-500 text-white px-6 py-1 md:py-2 rounded-b-xl shadow-lg font-bold text-sm md:text-xl animate-bounce";
                banner.style.opacity = 1;
                overlays.forEach(o => o?.classList.add('hidden'));
            } else {
                banner.innerText = "Opponent's Turn";
                banner.className = "absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-4 z-40 bg-gray-500 text-white px-4 py-1 md:py-2 rounded-b-xl shadow-lg font-bold text-sm md:text-lg";
                banner.style.opacity = 1;
                overlays.forEach(o => o?.classList.remove('hidden'));
            }
        }
        
        // NEW: Trigger the flash, sound, and vibration with smart delay
        function triggerTurnNotification() {
             const now = Date.now();
             const timeSinceSink = now - latestSinkTime;
             
             // If a ship sank less than 3 seconds ago, wait until animation roughly clears
             // Otherwise, small delay to let user process the board state
             const delay = (timeSinceSink < 3000) ? 3000 - timeSinceSink : 500;

             setTimeout(() => {
                 SoundFX.bell(); // Ding-Ding!
                 
                 // Haptic feedback (if supported)
                 if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                 
                 // Visual Flash Overlay
                 const overlay = document.getElementById('turnFlashOverlay');
                 const box = document.getElementById('turnMsgBox');
                 
                 // Show
                 overlay.classList.remove('opacity-0'); 
                 box.classList.remove('scale-50'); 
                 box.classList.add('scale-100');
                 
                 // Hide after 1.5s
                 setTimeout(() => {
                     overlay.classList.add('opacity-0');
                     box.classList.remove('scale-100');
                     box.classList.add('scale-50');
                 }, 1500);
             }, delay);
        }

        window.handleAttack = function(index) {
            if (!currentRoomId) return;
            if (myShots.includes(index)) return;
            if (isProcessingTurn) { console.log("Ignored double tap"); return; }
            
            // FIX 5: IMMEDIATE LOCK
            isProcessingTurn = true; 
            document.querySelectorAll('.board-container').forEach(el => el.classList.add('grid-disabled'));

            SoundFX.launch();
            triggerMissileAnimation(index);

            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId);
            getDoc(roomRef).then(snap => {
                const data = snap.data();
                if (data.currentTurn !== user.uid) { isProcessingTurn = false; return; }
                const nextTurn = (user.uid === data.host.uid) ? data.guest.uid : data.host.uid;
                
                // FIX: Fallback if nextTurn logic fails
                if (!nextTurn) {
                    console.error("Next turn user invalid!");
                    isProcessingTurn = false;
                    return;
                }

                const newMove = { uid: user.uid, index: index };
                setTimeout(() => {
                    updateDoc(roomRef, { moves: arrayUnion(newMove), currentTurn: nextTurn, lastAction: `Shot fired!` })
                    .catch(e => {
                        // In case of write failure, unlock
                        isProcessingTurn = false;
                        document.querySelectorAll('.board-container').forEach(el => el.classList.remove('grid-disabled'));
                    });
                    
                    const hitShip = enemyShipsCache.find(s => getShipIndices(s.index, s.size, s.horizontal).includes(index));
                    if(hitShip) SoundFX.boom(); else SoundFX.splash();
                }, 600); 
            });
        }

        function triggerMissileAnimation(targetIndex) {
            let board = document.getElementById('enemyBoard');
            if (!board || !board.offsetParent) board = document.getElementById('enemyBoardDesktop');
            
            const targetCell = board.querySelector(`div[data-index='${targetIndex}']`);
            if(!targetCell) return;
            
            const rect = targetCell.getBoundingClientRect();
            const startX = window.innerWidth / 2;
            const startY = window.innerHeight;
            const targetX = rect.left + rect.width / 2;
            const targetY = rect.top + rect.height / 2;

            const missile = document.createElement('div');
            missile.className = 'missile';
            missile.innerText = '🚀';
            document.getElementById('fx-layer').appendChild(missile);

            missile.animate([
                { transform: `translate(${startX}px, ${startY}px) scale(0.5) rotate(-45deg)`, opacity: 0 },
                { transform: `translate(${startX}px, ${startY}px) scale(0.5) rotate(-45deg)`, opacity: 1, offset: 0.1 },
                { transform: `translate(${targetX}px, ${targetY}px) scale(2.5) rotate(-45deg)`, opacity: 1 }
            ], { duration: 600, easing: 'ease-in', fill: 'forwards' });

            setTimeout(() => missile.remove(), 600);
        }

        function triggerAtomicExplosion(boardId, centerIndex) {
            const board = document.getElementById(boardId);
            if (!board) return;
            const cell = board.querySelector(`div[data-index='${centerIndex}']`);
            if(!cell) return;
            
            const rect = cell.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const container = document.getElementById('fx-layer');

            const core = document.createElement('div');
            core.className = 'atomic-core';
            core.style.transform = `translate(${centerX}px, ${centerY}px) scale(0)`;
            core.style.left = centerX + 'px';
            core.style.top = centerY + 'px';
            container.appendChild(core); 

            const wave = document.createElement('div');
            wave.className = 'atomic-wave';
            wave.style.left = centerX + 'px';
            wave.style.top = centerY + 'px';
            container.appendChild(wave);

            setTimeout(() => { core.remove(); wave.remove(); }, 2000);
        }

        function showGameOver(winnerUid) {
            const modal = document.getElementById('gameOverModal');
            const title = document.getElementById('gameOverTitle');
            const sub = document.getElementById('gameOverSubtitle');
            const icon = document.getElementById('winnerText');
            const confetti = document.getElementById('confettiContainer');
            
            modal.classList.remove('hidden');
            confetti.innerHTML = ''; 

            if (winnerUid === user.uid) {
                SoundFX.victory();
                title.innerText = "VICTORY!";
                title.className = "text-5xl font-bold text-yellow-500 mb-2 drop-shadow-lg";
                sub.innerText = "You sank the entire fleet!";
                icon.innerText = "🏆";
                for(let i=0; i<30; i++) {
                    const el = document.createElement('div');
                    el.className = 'confetti';
                    el.innerText = ['🎉','🎊','✨','⭐'][Math.floor(Math.random()*4)];
                    el.style.left = Math.random()*100 + '%';
                    el.style.animationDuration = (2 + Math.random()*2) + 's';
                    el.style.animationDelay = Math.random() + 's';
                    confetti.appendChild(el);
                }
            } else {
                title.innerText = "Nice Try!";
                title.className = "text-5xl font-bold text-slate-600 mb-2";
                sub.innerText = "Try again next time!";
                icon.innerText = "🏳️";
                for(let i=0; i<40; i++) {
                    const el = document.createElement('div');
                    el.className = 'rain';
                    el.style.left = Math.random()*100 + '%';
                    el.style.animationDuration = (0.5 + Math.random()*0.5) + 's';
                    el.style.animationDelay = Math.random() + 's';
                    confetti.appendChild(el);
                }
            }
        }

        function updateGrids() {
            const generate = (elementId, isInteractive, isSetup, isPlayer) => {
                const board = document.getElementById(elementId);
                if (!board) return;
                board.innerHTML = ''; 
                board.appendChild(createLabel('')); 
                for (let c of COLS) board.appendChild(createLabel(c));

                for (let r = 0; r < 10; r++) {
                    board.appendChild(createLabel(r + 1));
                    for (let c = 0; c < 10; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'grid-cell';
                        const index = r * 10 + c;
                        cell.dataset.index = index;

                        if (isSetup) {
                            const ship = placedShips.find(s => getShipIndices(s.index, s.size, s.horizontal).includes(index));
                            if (ship) { cell.classList.add('occupied', ship.color); }
                            if (isInteractive) cell.onclick = () => handleSetupClick(index);
                        } else if (isPlayer) {
                            const ship = placedShips.find(s => getShipIndices(s.index, s.size, s.horizontal).includes(index));
                            if (ship) { cell.classList.add('occupied', ship.color); }
                            if (enemyShots.includes(index)) {
                                if (ship) cell.classList.add('hit');
                                else cell.classList.add('miss');
                            }
                        } else {
                            if (myShots.includes(index)) {
                                const hitShip = enemyShipsCache.find(s => getShipIndices(s.index, s.size, s.horizontal).includes(index));
                                if (hitShip) cell.classList.add('hit');
                                else cell.classList.add('miss');
                            } else if (isInteractive) {
                                cell.onclick = () => handleAttack(index);
                            }
                        }
                        board.appendChild(cell);
                    }
                }
            };

            generate('setupBoard', true, true, false); 
            generate('setupBoardDesktop', true, true, false); 
            generate('playerBoard', false, false, true); 
            generate('enemyBoard', true, false, false); 
            generate('enemyBoardDesktop', true, false, false); 
        }

        function createLabel(text) {
            const el = document.createElement('div');
            el.className = 'label-cell';
            el.innerText = text;
            return el;
        }

        window.switchScreen = function(screenId) {
            document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
            if (screenId === 'setupScreen') { renderShipList(); updateGrids(); }
            else if (screenId === 'battleScreen') { 
                updateGrids(); 
                initEnemyFleetHUD(); // Initial render of HUD
            }
        }
        
        window.confirmExit = async function() {
            if (confirm("Are you sure you want to exit?")) {
                if(currentRoomId && user) {
                    const role = isHost ? 'host' : 'guest';
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId);
                    await updateDoc(roomRef, { [`${role}.left`]: true });
                    const snap = await getDoc(roomRef);
                    const d = snap.data();
                    if (d.host?.left && d.guest?.left) {
                        await deleteDoc(roomRef);
                        console.log("Room deleted as both players left.");
                    }
                }
                location.reload();
            }
        }

        window.updateLog = function(msg) {
            const logEl = document.getElementById('gameLog');
            // Make it visible
            logEl.style.opacity = 1; 
            logEl.style.transform = 'translate(-50%, 0) scale(1)';
            logEl.innerText = msg;
            
            // Auto hide after 3 seconds
            setTimeout(() => { 
                logEl.style.opacity = 0; 
                logEl.style.transform = 'translate(-50%, -20px) scale(0.95)';
            }, 3000);
        }
        
        function shakeBoard() {
             // Shake both possible boards
             ['setupBoard', 'setupBoardDesktop'].forEach(id => {
                 const b = document.getElementById(id);
                 if(b) {
                     b.style.transform = "translateX(5px)";
                     setTimeout(()=>b.style.transform = "translateX(-5px)", 50);
                     setTimeout(()=>b.style.transform = "translateX(0)", 100);
                 }
             });
        }
    </script>
</body>
