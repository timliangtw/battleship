<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kids Sea Battle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sea: { 100:'#E0F7FA', 300:'#4DD0E1', 500:'#00BCD4', 700:'#0097A7' },
                        ship: { DEFAULT: '#FFB74D', active: '#FF9800' }, 
                        hit: '#EF5350', miss: '#FFFFFF'
                    },
                    fontFamily: { 'cute': ['"Fredoka"', 'sans-serif'] },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'bounce-slight': 'bounce 0.5s infinite',
                        'spin-slow': 'spin 3s linear infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #E0F7FA;
            font-family: 'Fredoka', sans-serif;
            touch-action: manipulation;
            overflow: hidden;
            user-select: none;
        }

        #orientation-lock {
            display: none;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #00BCD4; z-index: 9999;
            flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center;
        }
        @media screen and (orientation: portrait) {
            #orientation-lock { display: flex; }
            main { display: none; }
        }

        .board-container {
            display: grid;
            grid-template-columns: 20px repeat(10, 1fr); 
            grid-template-rows: 20px repeat(10, 1fr);
            gap: 2px;
            position: relative; 
        }
        .label-cell {
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; color: #0097A7; font-weight: bold;
        }
        .grid-cell {
            aspect-ratio: 1;
            background-color: #4DD0E1;
            border: 2px solid #80DEEA;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
        }
        
        .grid-cell.occupied { border-color: rgba(255, 255, 255, 0.5); box-shadow: inset 0 0 5px rgba(0,0,0,0.2); }
        .grid-cell.hit { background-color: #EF5350 !important; animation: shake 0.5s; }
        .grid-cell.hit::after { content: '💥'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.2rem; z-index: 10; }
        .grid-cell.miss { background-color: #B2EBF2 !important; }
        .grid-cell.miss::after { content: '💦'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1rem; opacity: 0.8; z-index: 10; }

        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -2px); } 100% { transform: translate(0, 0); } }

        /* --- VFX ANIMATIONS (Applied to FX Layer) --- */
        .missile {
            position: absolute; /* Changed from fixed to absolute within FX layer */
            font-size: 3rem; 
            pointer-events: none;
            filter: drop-shadow(0 0 8px orange);
            left: 0; top: 0;
            z-index: 201;
        }

        .atomic-core {
            position: absolute;
            left: 0; top: 0; /* Positioned via JS translate */
            width: 20px; height: 20px;
            background: radial-gradient(circle, #ffffff 0%, #ffeb3b 30%, #ff9800 60%, #ff5722 100%);
            border-radius: 50%;
            z-index: 202;
            pointer-events: none;
            box-shadow: 0 0 60px 30px rgba(255, 152, 0, 0.8);
            animation: atomic-expand 1.5s ease-out forwards;
        }

        .atomic-wave {
            position: absolute;
            left: 0; top: 0;
            width: 10px; height: 10px;
            border: 4px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            z-index: 201;
            pointer-events: none;
            animation: shockwave 1s ease-out forwards;
        }

        @keyframes atomic-expand {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            10% { transform: translate(-50%, -50%) scale(8); opacity: 1; } 
            50% { transform: translate(-50%, -50%) scale(10); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(12); opacity: 0; }
        }

        @keyframes shockwave {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; border-width: 10px; }
            100% { transform: translate(-50%, -50%) scale(20); opacity: 0; border-width: 0px; }
        }

        .rain { position: absolute; width: 3px; height: 15px; background: #60A5FA; bottom: 100%; animation: fall linear infinite; }
        @keyframes fall { to { transform: translateY(100vh); } }

        .confetti { position: absolute; width: 12px; height: 12px; bottom: 100%; animation: fall-spin linear infinite; }
        @keyframes fall-spin { to { transform: translateY(100vh) rotate(720deg); } }

        .disabled-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.2); z-index: 20;
            display: flex; align-items: center; justify-content: center;
            border-radius: 1rem; cursor: not-allowed; backdrop-filter: grayscale(0.5);
        }

        .ship-item { transition: all 0.2s; border: 3px solid transparent; }
        .ship-item.selected { background-color: #FFF9C4; border-color: #FF9800; transform: scale(1.05); }
        .ship-item.placed { opacity: 0.3; pointer-events: none; filter: grayscale(100%); }

        .pulse-dot { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); animation: pulse-green 2s infinite; }
        @keyframes pulse-green { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); } }
    </style>
</head>
<body class="h-[100dvh] flex flex-col text-slate-700">

    <div id="orientation-lock">
        <i class="fa-solid fa-mobile-screen-button fa-rotate-270 text-6xl mb-4 animate-bounce"></i>
        <h1 class="text-3xl font-bold">Please Rotate!</h1>

    <!-- FX Layer: Independent overlay for animations so they don't get deleted by grid redraws -->

    <header class="bg-sea-500 text-white p-2 px-4 flex justify-between items-center shadow-md z-50 h-16 shrink-0 relative">

            <i class="fa-solid fa-ship text-2xl text-yellow-300"></i>

        </div>
        <div class="flex items-center gap-2 bg-white/20 px-3 py-1 rounded-full">

        <div class="text-sm font-mono bg-sea-700 px-3 py-1 rounded-lg">

    <main class="flex-1 relative w-full h-full overflow-hidden bg-sea-100 p-2">
        
        <div id="lobbyScreen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-sea-300/90 backdrop-blur-sm">
            <div class="bg-white p-8 rounded-3xl shadow-xl max-w-sm w-full text-center border-4 border-sea-500">

        <div id="setupScreen" class="hidden h-full flex gap-4 max-w-6xl mx-auto items-center justify-center">
            <div class="w-1/3 h-full max-h-[500px] flex flex-col gap-2 bg-white p-3 rounded-3xl shadow-lg border-4 border-sea-200">
                <h3 class="text-xl font-bold text-sea-700 text-center">My Fleet</h3>
                <div class="text-xs text-center text-slate-500 mb-1">Tap board to place/rotate ships.</div>
                <div id="shipList" class="flex-1 space-y-2 overflow-y-auto pr-1 flex flex-col items-center"></div>
                <div class="flex gap-2">
                    <button onclick="randomizeShips()" class="flex-1 py-3 bg-blue-500 text-white font-bold rounded-xl shadow border-b-4 border-blue-700 active:border-b-0 active:translate-y-1">Random 🔀</button>
                    <button onclick="resetSetup()" class="px-4 py-3 bg-red-400 text-white font-bold rounded-xl shadow border-b-4 border-red-600 active:border-b-0 active:translate-y-1"><i class="fa-solid fa-trash"></i></button>
                </div>
                <button id="startGameBtn" onclick="setReady()" disabled class="w-full py-3 bg-gray-400 text-white text-xl font-bold rounded-xl shadow-lg border-b-4 border-gray-600 transition-all">Place all ships!</button>
            </div>
            <div class="h-full aspect-square max-h-[90vh] bg-white p-3 rounded-3xl shadow-lg border-4 border-sea-200 flex flex-col items-center justify-center">
                 <div id="setupBoard" class="board-container w-full h-full bg-sea-100 p-1 rounded-xl"></div>
            </div>
            <div id="waitingForOpponent" class="hidden absolute inset-0 bg-black/60 z-50 flex items-center justify-center backdrop-blur-sm">
                <div class="bg-white p-6 rounded-2xl text-center shadow-2xl animate-bounce">

        <div id="battleScreen" class="hidden h-full flex gap-4 max-w-7xl mx-auto items-center justify-center p-2 relative">
            <div id="turnBanner" class="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-2 z-40 bg-gray-500 text-white px-8 py-2 rounded-b-xl shadow-lg font-bold text-xl transition-all duration-300">Waiting...</div>
            <div class="h-full aspect-square max-h-[85vh] flex flex-col relative">

                    <button onclick="confirmExit()" class="bg-red-500 text-white text-xs px-3 py-1 rounded-full font-bold hover:bg-red-600">Exit</button>
                </div>
                <div class="flex-1 bg-white p-2 rounded-3xl shadow-xl border-4 border-red-200 relative overflow-visible">
                     <div id="enemyBoard" class="board-container w-full h-full bg-sea-100 p-1 rounded-xl"></div>
                     <div id="enemyBoardOverlay" class="disabled-overlay hidden">
                         <span class="text-white font-bold text-2xl drop-shadow-md">Opponent's Turn</span>
                     </div>
                </div>
            </div>
            <div class="w-1/3 h-full max-h-[85vh] flex flex-col">
                <h3 class="text-xl font-bold text-sea-700 text-center mb-2">My Ships</h3>
                <div class="bg-white p-2 rounded-3xl shadow-lg border-4 border-sea-200 aspect-square mb-2">
                    <div id="playerBoard" class="board-container small-board w-full h-full bg-sea-100 p-1 rounded-lg"></div>
                </div>
                <div class="flex-1 bg-white rounded-3xl shadow p-2 flex flex-col justify-center items-center gap-1 border-4 border-sea-100">
                     <div class="text-slate-400 text-xs font-bold uppercase">vs</div>
                     <div id="opponentNameDisplay" class="text-lg text-sea-700 font-bold">Opponent</div>
                </div>
            </div>
        </div>
        
        <div id="gameOverModal" class="hidden absolute inset-0 z-[60] flex flex-col items-center justify-center bg-black/80 backdrop-blur-md overflow-hidden">
            <div id="confettiContainer" class="absolute inset-0 pointer-events-none"></div>
            <div class="bg-white p-8 rounded-3xl shadow-2xl text-center max-w-md w-full animate-bounce-slight border-4 border-yellow-400 relative z-10">
                <div id="winnerText" class="text-6xl mb-4">🏆</div>
                <h2 id="gameOverTitle" class="text-5xl font-bold text-sea-700 mb-2">YOU WIN!</h2>
                <p id="gameOverSubtitle" class="text-xl text-slate-500 mb-8 font-bold">All enemy ships destroyed!</p>
                <button onclick="confirmExit()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-6 rounded-2xl text-xl shadow-lg border-b-4 border-green-700 active:border-b-0 active:translate-y-1">
                    Exit & Delete Room
                </button>
            </div>
        </div>

    </main>
    
    <div id="versionLabel" class="fixed bottom-1 right-1 text-xs text-slate-400 pointer-events-none z-50"></div>
    <footer id="gameLog" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-white/90 backdrop-blur px-6 py-2 rounded-full shadow-lg text-lg font-bold text-sea-700 pointer-events-none transition-all duration-300 z-50 border-2 border-sea-200 whitespace-nowrap">Connecting...</footer>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
        import { getFirestore, collection, addDoc, doc, onSnapshot, updateDoc, setDoc, getDoc, deleteDoc, arrayUnion } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

        // --- VERSION ---
        const APP_VERSION = "v1.8 (Turn Fix & Indep FX)";
        document.getElementById('versionLabel').innerText = APP_VERSION;

        // --- AUDIO ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        const SoundFX = {
            resume: () => { if (audioCtx.state === 'suspended') audioCtx.resume(); },
            playNoise: (duration, type = 'highpass') => {
                SoundFX.resume();
                const bufferSize = audioCtx.sampleRate * duration;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = type;
                filter.frequency.value = 1000;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start();
            },
            launch: () => {
                SoundFX.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.6);
            },
            boom: () => SoundFX.playNoise(0.3, 'lowpass'),
            splash: () => SoundFX.playNoise(0.3, 'highpass'),
            sink: () => {
                 SoundFX.resume();
                 SoundFX.playNoise(2.0, 'lowpass');
                 const osc = audioCtx.createOscillator();
                 const gain = audioCtx.createGain();
                 osc.type = 'sawtooth';
                 osc.frequency.setValueAtTime(80, audioCtx.currentTime);
                 osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 1.5);
                 gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                 gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
                 osc.connect(gain); gain.connect(audioCtx.destination);
                 osc.start(); osc.stop(audioCtx.currentTime + 1.5);
            }
        };

        // --- CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyAFHSgSTrxn5D0tQOsbUckQ_xEvxbh2mq4",
            authDomain: "battleship-d5dbb.firebaseapp.com",
            projectId: "battleship-d5dbb",
            storageBucket: "battleship-d5dbb.firebasestorage.app",
            messagingSenderId: "40264054224",
            appId: "1:40264054224:web:e8176d4669aeca6b7535d5"
        };

        let app, auth, db, user;
        const appId = "kids-battle-ship-v1"; 

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            signInAnonymously(auth).catch(e => console.error(e));
            onAuthStateChanged(auth, (u) => {
                const dot = document.getElementById('connDot');
                const text = document.getElementById('connText');
                if (u) {
                    user = u;
                    dot.classList.remove('bg-red-500'); dot.classList.add('bg-green-500', 'pulse-dot');
                    text.innerText = "Connected";
                    updateLog("✅ Ready to play!");
                } else {
                    dot.classList.remove('bg-green-500', 'pulse-dot'); dot.classList.add('bg-red-500');
                    text.innerText = "Offline";
                }
            });
        } catch (e) { console.error(e); }

        const FLEET_TYPES = [
            { id: 'carrier', name: 'Carrier', size: 5, color: 'bg-yellow-500' },
            { id: 'battleship', name: 'Battleship', size: 4, color: 'bg-orange-500' },
            { id: 'cruiser', name: 'Cruiser', size: 3, color: 'bg-red-400' },
            { id: 'submarine', name: 'Sub', size: 3, color: 'bg-green-500' },
            { id: 'destroyer', name: 'Destroyer', size: 2, color: 'bg-blue-400' }
        ];

        let currentRoomId = null;
        let isHost = false;
        let placedShips = []; 
        let selectedShipType = null; 
        let enemyShipsCache = []; 
        let myShots = []; 
        let enemyShots = [];
        let sunkShipsLog = new Set(); 
        
        // --- NEW LOCK VARIABLE ---
        let isProcessingTurn = false;

        // --- SETUP LOGIC ---
        window.renderShipList = function() {
            const list = document.getElementById('shipList');
            list.innerHTML = '';
            FLEET_TYPES.forEach(ship => {
                const isPlaced = placedShips.find(s => s.id === ship.id);
                const div = document.createElement('div');
                div.className = `ship-item w-full p-2 rounded-xl bg-sea-100 border border-sea-300 cursor-pointer flex justify-between items-center ${isPlaced ? 'placed' : ''} ${selectedShipType?.id === ship.id ? 'selected' : ''}`;
                if (!isPlaced) div.onclick = () => selectShipType(ship);
                let blocks = '';
                for(let i=0; i<ship.size; i++) blocks += `<div class="w-4 h-4 rounded ${ship.color} border border-white"></div>`;
                div.innerHTML = `<span class="font-bold text-sm">${ship.name} (${ship.size})</span><div class="flex gap-1">${blocks}</div>`;
                list.appendChild(div);
            });
            checkStartButton();
        }

        window.selectShipType = function(ship) {
            selectedShipType = ship; renderShipList(); 
            updateLog(`Selected ${ship.name}. Tap board.`);
        }

        window.handleSetupClick = function(index) {
            const clickedShipIndex = placedShips.findIndex(s => getShipIndices(s.index, s.size, s.horizontal).includes(index));
            if (clickedShipIndex !== -1) {
                const ship = placedShips[clickedShipIndex];
                const newHorizontal = !ship.horizontal;
                placedShips.splice(clickedShipIndex, 1);
                if (isValidPlacement(ship.index, ship.size, newHorizontal)) {
                    ship.horizontal = newHorizontal; placedShips.push(ship);
                    updateLog(`Rotated ${ship.name}!`);
                } else {
                    ship.horizontal = !newHorizontal; placedShips.push(ship);
                    updateLog(`Can't rotate here.`); shakeBoard();
                }
                renderShipList(); createGrid('setupBoard', true); return;
            }
            if (selectedShipType) {
                if (isValidPlacement(index, selectedShipType.size, true)) {
                    placedShips.push({
                        id: selectedShipType.id, name: selectedShipType.name, size: selectedShipType.size, color: selectedShipType.color,
                        index: index, horizontal: true 
                    });
                    selectedShipType = null; renderShipList(); createGrid('setupBoard', true);
                } else {
                    updateLog("Can't place here!"); shakeBoard();
                }
            }
        }

        function getShipIndices(startIndex, size, horizontal) {
            let indices = [];
            let r = Math.floor(startIndex / 10);
            let c = startIndex % 10;
            for (let i = 0; i < size; i++) {
                if (horizontal) indices.push(r * 10 + (c + i));
                else indices.push((r + i) * 10 + c);
            }
            return indices;
        }

        function isValidPlacement(index, size, horizontal) {
            let r = Math.floor(index / 10);
            let c = index % 10;
            if (horizontal && c + size > 10) return false;
            if (!horizontal && r + size > 10) return false;
            const newIndices = getShipIndices(index, size, horizontal);
            for (let s of placedShips) {
                const existingIndices = getShipIndices(s.index, s.size, s.horizontal);
                if (newIndices.some(idx => existingIndices.includes(idx))) return false;
            }
            return true;
        }

        window.randomizeShips = function() {
            placedShips = [];
            for (let ship of FLEET_TYPES) {
                let placed = false; let attempts = 0;
                while (!placed && attempts < 100) {
                    const idx = Math.floor(Math.random() * 100);
                    const horiz = Math.random() > 0.5;
                    if (isValidPlacement(idx, ship.size, horiz)) {
                        placedShips.push({ id: ship.id, name: ship.name, size: ship.size, color: ship.color, index: idx, horizontal: horiz });
                        placed = true;
                    }
                    attempts++;
                }
            }
            renderShipList(); createGrid('setupBoard', true);
        }

        window.resetSetup = function() { placedShips = []; selectedShipType = null; renderShipList(); createGrid('setupBoard', true); }

        function checkStartButton() {
            const btn = document.getElementById('startGameBtn');
            if (placedShips.length === FLEET_TYPES.length) {
                btn.disabled = false;
                btn.classList.remove('bg-gray-400');
                btn.classList.add('bg-green-500', 'animate-pulse');
                btn.innerText = "I'm Ready! ▶";
            } else {
                btn.disabled = true;
                btn.classList.add('bg-gray-400');
                btn.classList.remove('bg-green-500', 'animate-pulse');
                btn.innerText = `Place all ships (${placedShips.length}/5)`;
            }
        }

        // --- ROOM LOGIC ---
        window.createRoom = async function() {
            if (!user) return alert("Wait for connection...");
            const name = document.getElementById('playerNameInput').value || "Captain";
            const roomId = Math.floor(1000 + Math.random() * 9000).toString();
            currentRoomId = roomId; isHost = true;
            try {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                await setDoc(roomRef, {
                    host: { uid: user.uid, name: name, ready: false, left: false },
                    status: 'waiting', moves: [], currentTurn: null, createdAt: Date.now()
                });
                document.getElementById('roomIdDisplay').innerText = roomId;
                switchScreen('setupScreen'); listenToRoom(roomId);
            } catch (err) { console.error(err); alert("Create Error. Check Rules."); }
        };

        window.joinRoom = async function() {
            if (!user) return;
            const name = document.getElementById('playerNameInput').value || "Sailor";
            const roomId = document.getElementById('joinRoomId').value;
            if (!roomId || roomId.length !== 4) return alert("Enter 4-digit ID");
            try {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                const roomSnap = await getDoc(roomRef);
                if (roomSnap.exists()) {
                    const data = roomSnap.data();
                    if (data.host.uid === user.uid) { alert("⚠️ Use different device!"); return; }
                    await updateDoc(roomRef, { 
                        "guest.uid": user.uid, "guest.name": name, "guest.ready": false, "guest.left": false,
                        status: 'setup', lastAction: 'Joined' 
                    });
                    currentRoomId = roomId; isHost = false;
                    document.getElementById('roomIdDisplay').innerText = roomId;
                    switchScreen('setupScreen'); listenToRoom(roomId);
                } else { alert("Room not found!"); }
            } catch (err) { console.error(err); }
        };

        window.setReady = async function() {
            if (!currentRoomId) return;
            document.getElementById('startGameBtn').disabled = true;
            document.getElementById('startGameBtn').innerText = "Waiting...";
            document.getElementById('waitingForOpponent').classList.remove('hidden');
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId);
            const role = isHost ? 'host' : 'guest';
            await updateDoc(roomRef, { [`${role}.ships`]: placedShips, [`${role}.ready`]: true, lastAction: `${role.toUpperCase()} Ready` });
        }

        function listenToRoom(roomId) {
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
            onSnapshot(roomRef, (docSnap) => {
                if (!docSnap.exists()) { alert("Room deleted."); location.reload(); return; }
                const data = docSnap.data();
                
                // UNLOCK TURN if it's my turn
                if (data.currentTurn === user.uid) {
                    isProcessingTurn = false;
                }

                if (data.host?.ready && data.guest?.ready && data.status !== 'playing' && data.status !== 'finished') {
                    if (isHost) {
                        const startPlayer = Math.random() > 0.5 ? data.host.uid : data.guest.uid;
                        updateDoc(roomRef, { status: 'playing', currentTurn: startPlayer, lastAction: "Game Started" });
                    }
                }

                if (data.status === 'finished') {
                    showGameOver(data.winner);
                }

                if (data.status === 'playing' || data.status === 'finished') {
                    if (isHost) enemyShipsCache = data.guest.ships || [];
                    else enemyShipsCache = data.host.ships || [];
                    
                    const oppName = isHost ? (data.guest?.name || 'Guest') : (data.host?.name || 'Host');
                    document.getElementById('opponentNameDisplay').innerText = oppName;

                    const newMyShots = [];
                    const newEnemyShots = [];
                    if (data.moves) {
                        data.moves.forEach(m => {
                            if (m.uid === user.uid) newMyShots.push(m.index);
                            else newEnemyShots.push(m.index);
                        });
                    }
                    
                    myShots = newMyShots;
                    enemyShots = newEnemyShots;
                    
                    checkAllSinks(myShots, enemyShipsCache, 'enemyBoard'); 
                    checkAllSinks(enemyShots, placedShips, 'playerBoard'); 
                    
                    if (data.status === 'playing') {
                        if (checkWin(myShots, enemyShipsCache)) {
                            updateDoc(roomRef, { status: 'finished', winner: user.uid });
                        } else if (checkWin(enemyShots, placedShips)) {
                            const winnerUid = isHost ? data.guest.uid : data.host.uid;
                            updateDoc(roomRef, { status: 'finished', winner: winnerUid });
                        }
                    }

                    updateTurnUI(data.currentTurn, data.status);
                    
                    if (document.getElementById('battleScreen').classList.contains('hidden')) {
                        switchScreen('battleScreen');
                    } else {
                        createGrid('enemyBoard', true);
                        createGrid('playerBoard', false);
                    }
                }
                
                if (data.lastAction) updateLog(`🔔 ${data.lastAction}`);
            });
        }
        
        function checkWin(shots, ships) {
            if (!ships || ships.length === 0) return false;
            return ships.every(ship => {
                const indices = getShipIndices(ship.index, ship.size, ship.horizontal);
                return indices.every(idx => shots.includes(idx));
            });
        }

        function checkAllSinks(shots, ships, boardId) {
            ships.forEach(ship => {
                const shipId = `${boardId}-${ship.index}`; 
                if (!sunkShipsLog.has(shipId)) {
                    const indices = getShipIndices(ship.index, ship.size, ship.horizontal);
                    const isSunk = indices.every(idx => shots.includes(idx));
                    if (isSunk) {
                        sunkShipsLog.add(shipId);
                        SoundFX.sink();
                        const centerIdx = indices[Math.floor(indices.length/2)];
                        triggerAtomicExplosion(boardId, centerIdx);
                        if(boardId === 'playerBoard') updateLog("OUCH! Your ship sunk!");
                        else updateLog("BOOM! Enemy ship sunk!");
                    }
                }
            });
        }

        function updateTurnUI(turnUid, status) {
            const banner = document.getElementById('turnBanner');
            const overlay = document.getElementById('enemyBoardOverlay');
            
            if (status === 'finished') {
                banner.innerText = "GAME OVER";
                banner.className = "absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-2 z-40 bg-purple-600 text-white px-8 py-2 rounded-b-xl shadow-lg font-bold text-xl";
                overlay.classList.add('hidden'); 
                return;
            }

            if (!turnUid) return;
            const isMyTurn = turnUid === user.uid;
            
            if (isMyTurn) {
                banner.innerText = "YOUR TURN!";
                banner.className = "absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-2 z-40 bg-green-500 text-white px-8 py-2 rounded-b-xl shadow-lg font-bold text-xl animate-bounce";
                overlay.classList.add('hidden');
            } else {
                banner.innerText = "Opponent's Turn";
                banner.className = "absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-2 z-40 bg-gray-500 text-white px-6 py-2 rounded-b-xl shadow-lg font-bold text-lg";
                overlay.classList.remove('hidden');
            }
        }

        // --- BATTLE ACTIONS ---
        window.handleAttack = function(index) {
            if (!currentRoomId) return;
            if (myShots.includes(index)) return;
            
            // --- FIX 1: TRIGGER LOCK ---
            if (isProcessingTurn) {
                console.log("Ignored: Processing previous shot");
                return;
            }
            isProcessingTurn = true; // Lock immediately

            SoundFX.launch();
            triggerMissileAnimation(index);

            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId);
            getDoc(roomRef).then(snap => {
                const data = snap.data();
                // Double check validity
                if (data.currentTurn !== user.uid) {
                    isProcessingTurn = false; // Unlock if invalid
                    return; 
                }
                
                const nextTurn = (user.uid === data.host.uid) ? data.guest.uid : data.host.uid;
                const newMove = { uid: user.uid, index: index };
                
                setTimeout(() => {
                    updateDoc(roomRef, {
                        moves: arrayUnion(newMove),
                        currentTurn: nextTurn,
                        lastAction: `Shot fired!`
                    });
                    // Note: isProcessingTurn remains TRUE here. 
                    // It will be set to FALSE in listenToRoom when currentTurn becomes ME again.
                    
                    const hitShip = enemyShipsCache.find(s => getShipIndices(s.index, s.size, s.horizontal).includes(index));
                    if(hitShip) SoundFX.boom();
                    else SoundFX.splash();
                    
                }, 600); 
            });
        }

        // --- VISUALS ---
        function triggerMissileAnimation(targetIndex) {
            const board = document.getElementById('enemyBoard');
            const targetCell = board.querySelector(`div[data-index='${targetIndex}']`);
            if(!targetCell) return;
            
            const rect = targetCell.getBoundingClientRect();
            const startX = window.innerWidth / 2;
            const startY = window.innerHeight;
            
            const targetX = rect.left + rect.width / 2;
            const targetY = rect.top + rect.height / 2;

            const missile = document.createElement('div');
            missile.className = 'missile';
            missile.innerText = '🚀';
            
            // --- FIX 2: APPEND TO FX LAYER ---
            document.getElementById('fx-layer').appendChild(missile);

            missile.animate([
                { transform: `translate(${startX}px, ${startY}px) scale(0.5) rotate(-45deg)`, opacity: 0 },
                { transform: `translate(${startX}px, ${startY}px) scale(0.5) rotate(-45deg)`, opacity: 1, offset: 0.1 },
                { transform: `translate(${targetX}px, ${targetY}px) scale(2.5) rotate(-45deg)`, opacity: 1 }
            ], {
                duration: 600,
                easing: 'ease-in',
                fill: 'forwards'
            });

            setTimeout(() => missile.remove(), 600);
        }

        function triggerAtomicExplosion(boardId, centerIndex) {
            const board = document.getElementById(boardId);
            const cell = board.querySelector(`div[data-index='${centerIndex}']`);
            if(!cell) return;
            
            const rect = cell.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            // --- FIX 2: APPEND TO FX LAYER ---
            const container = document.getElementById('fx-layer');

            const core = document.createElement('div');
            core.className = 'atomic-core';
            // Need manual positioning since it's now in FX layer
            core.style.transform = `translate(${centerX}px, ${centerY}px) scale(0)`;
            // Wait, CSS animation uses translate(-50%, -50%). 
            // We need to set left/top to center, and let animation handle expand from there.
            core.style.left = centerX + 'px';
            core.style.top = centerY + 'px';
            
            container.appendChild(core); 

            const wave = document.createElement('div');
            wave.className = 'atomic-wave';
            wave.style.left = centerX + 'px';
            wave.style.top = centerY + 'px';
            container.appendChild(wave);

            setTimeout(() => { core.remove(); wave.remove(); }, 2000);
        }

        function showGameOver(winnerUid) {
            const modal = document.getElementById('gameOverModal');
            const title = document.getElementById('gameOverTitle');
            const sub = document.getElementById('gameOverSubtitle');
            const icon = document.getElementById('winnerText');
            const confetti = document.getElementById('confettiContainer');
            
            modal.classList.remove('hidden');
            confetti.innerHTML = ''; 

            if (winnerUid === user.uid) {
                title.innerText = "VICTORY!";
                title.className = "text-5xl font-bold text-yellow-500 mb-2 drop-shadow-lg";
                sub.innerText = "You sank the entire fleet!";
                icon.innerText = "🏆";
                for(let i=0; i<30; i++) {
                    const el = document.createElement('div');
                    el.className = 'confetti';
                    el.innerText = ['🎉','🎊','✨','⭐'][Math.floor(Math.random()*4)];
                    el.style.left = Math.random()*100 + '%';
                    el.style.animationDuration = (2 + Math.random()*2) + 's';
                    el.style.animationDelay = Math.random() + 's';
                    confetti.appendChild(el);
                }
            } else {
                title.innerText = "DEFEAT";
                title.className = "text-5xl font-bold text-slate-600 mb-2";
                sub.innerText = "Your fleet is at the bottom of the sea.";
                icon.innerText = "🏳️";
                for(let i=0; i<40; i++) {
                    const el = document.createElement('div');
                    el.className = 'rain';
                    el.style.left = Math.random()*100 + '%';
                    el.style.animationDuration = (0.5 + Math.random()*0.5) + 's';
                    el.style.animationDelay = Math.random() + 's';
                    confetti.appendChild(el);
                }
            }
        }

        const COLS = ['A','B','C','D','E','F','G','H','I','J'];

        function createGrid(elementId, interactive = false) {
            const board = document.getElementById(elementId);
            board.innerHTML = ''; 
            board.appendChild(createLabel('')); 
            for (let c of COLS) board.appendChild(createLabel(c));

            for (let r = 0; r < 10; r++) {
                board.appendChild(createLabel(r + 1));
                for (let c = 0; c < 10; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    const index = r * 10 + c;
                    cell.dataset.index = index;

                    if (elementId === 'setupBoard') {
                        const ship = placedShips.find(s => getShipIndices(s.index, s.size, s.horizontal).includes(index));
                        if (ship) { cell.classList.add('occupied', ship.color); }
                        if (interactive) cell.onclick = () => handleSetupClick(index);
                    }
                    if (elementId === 'playerBoard') {
                        const ship = placedShips.find(s => getShipIndices(s.index, s.size, s.horizontal).includes(index));
                        if (ship) { cell.classList.add('occupied', ship.color); }
                        if (enemyShots.includes(index)) {
                            if (ship) cell.classList.add('hit');
                            else cell.classList.add('miss');
                        }
                    }
                    if (elementId === 'enemyBoard') {
                        if (myShots.includes(index)) {
                            const hitShip = enemyShipsCache.find(s => getShipIndices(s.index, s.size, s.horizontal).includes(index));
                            if (hitShip) cell.classList.add('hit');
                            else cell.classList.add('miss');
                        } else if (interactive) {
                            cell.onclick = () => handleAttack(index);
                        }
                    }
                    board.appendChild(cell);
                }
            }
        }

        function createLabel(text) {
            const el = document.createElement('div');
            el.className = 'label-cell';
            el.innerText = text;
            return el;
        }

        window.switchScreen = function(screenId) {
            document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
            if (screenId === 'setupScreen') { renderShipList(); createGrid('setupBoard', true); }
            else if (screenId === 'battleScreen') { createGrid('enemyBoard', true); createGrid('playerBoard', false); }
        }
        
        window.confirmExit = async function() {
            if (confirm("Are you sure you want to exit?")) {
                if(currentRoomId && user) {
                    const role = isHost ? 'host' : 'guest';
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId);
                    await updateDoc(roomRef, { [`${role}.left`]: true });
                    const snap = await getDoc(roomRef);
                    const d = snap.data();
                    if (d.host?.left && d.guest?.left) {
                        await deleteDoc(roomRef);
                        console.log("Room deleted as both players left.");
                    }
                }
                location.reload();
            }
        }

        window.updateLog = function(msg) {
            const logEl = document.getElementById('gameLog');
            logEl.style.opacity = 0;
            setTimeout(() => { logEl.innerText = msg; logEl.style.opacity = 1; }, 100);
        }
        
        function shakeBoard() {
             const board = document.getElementById('setupBoard');
             board.style.transform = "translateX(5px)";
             setTimeout(()=>board.style.transform = "translateX(-5px)", 50);
             setTimeout(()=>board.style.transform = "translateX(0)", 100);
        }
    </script>
</body>
